services:
    _defaults:
        autowire: true
        autoconfigure: true

    OHMedia\UtilityBundle\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/OHMediaUtilityBundle.php'

    OHMedia\TimezoneBundle\EventListener\TimezoneListener:
        autowire: true
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }
